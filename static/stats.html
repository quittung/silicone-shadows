<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silicone Shadows — Stats</title>
  <style>
    :root { color-scheme: dark; font: 15px/1.4 system-ui, sans-serif; --bg:#111418; --panel:#1a1f25; --border:#333b45; --text:#e8edf2; --muted:#98a3ae; --accent:#22d3ee; --good:#4ade80; --warn:#fbbf24; --bad:#fb7185; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    header { height:58px; display:flex; align-items:center; gap:1rem; padding:.6rem 1rem; position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--border); }
    header strong { margin-right:auto; }
    nav { display:flex; gap:.35rem; }
    nav a { color:var(--muted); text-decoration:none; padding:.4rem .6rem; border-radius:5px; }
    nav a:hover, nav a.active { color:var(--text); background:#28313a; }
    main { max-width:1400px; margin:auto; padding:1.2rem; }
    h1 { margin:.2rem 0 1rem; font-size:1.55rem; }
    h2 { margin:1.5rem 0 .7rem; font-size:1.15rem; }
    .summary-charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(26rem,1fr)); gap:.8rem; }
    .summary-chart { padding:1rem; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
    .summary-chart h2 { display:flex; justify-content:space-between; gap:1rem; margin:0 0 .7rem; }
    .summary-chart h2 span { color:var(--muted); font-size:.85rem; font-weight:400; }
    .summary-stack { height:2.4rem; display:flex; overflow:hidden; border-radius:6px; background:#252c34; }
    .summary-keys { display:flex; flex-wrap:wrap; gap:.55rem 1rem; margin-top:.7rem; color:var(--muted); font-size:.85rem; }
    .summary-keys span { display:flex; align-items:center; gap:.35rem; }
    .summary-keys i { width:.75rem; height:.75rem; border-radius:2px; }
    .summary-keys strong { color:var(--text); font-variant-numeric:tabular-nums; }
    .legend { display:flex; justify-content:flex-end; gap:1rem; margin:-2rem 0 .65rem; color:var(--muted); font-size:.85rem; }
    .legend span { display:flex; align-items:center; gap:.35rem; }
    .legend i { width:.75rem; height:.75rem; border-radius:2px; }
    .legend .good-key i, .segment.good { background:var(--good); }
    .legend .perspective-key i, .segment.perspective { background:var(--warn); }
    .legend .unusable-key i, .segment.unusable { background:var(--bad); }
    .legend .unprocessed-key i, .segment.unprocessed, .summary-keys .unprocessed i { background:#48515c; }
    .segment.ready, .summary-keys .ready i { background:var(--accent); }
    .segment.review-pending, .summary-keys .review-pending i { background:var(--warn); }
    .summary-keys .good i { background:var(--good); }
    .summary-keys .perspective i { background:var(--warn); }
    .summary-keys .unusable i { background:var(--bad); }
    .chart { overflow:auto; max-height:560px; border:1px solid var(--border); border-radius:8px; background:var(--panel); }
    .chart-row { display:grid; grid-template-columns:minmax(9rem,18rem) minmax(16rem,1fr) 4.5rem; gap:.7rem; align-items:center; padding:.48rem .6rem; border-bottom:1px solid #2a3139; }
    .chart-row:last-child { border-bottom:0; }
    .chart-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .stack { min-width:0; height:1.8rem; display:flex; overflow:hidden; border-radius:5px; background:#252c34; font-variant-numeric:tabular-nums; }
    .segment { flex-basis:0; min-width:2rem; display:grid; place-items:center; color:#111418; font-size:.8rem; font-weight:700; }
    .segment.unprocessed { color:var(--text); }
    .chart-total { text-align:right; font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .chart-total small { display:block; color:var(--muted); font-size:.68rem; font-weight:400; text-transform:uppercase; }
    @media (max-width:700px) {
      .summary-charts { grid-template-columns:1fr; }
      .legend { margin:0 0 .65rem; justify-content:flex-start; flex-wrap:wrap; }
      .chart-row { grid-template-columns:1fr 3.5rem; }
      .stack { grid-column:1 / -1; grid-row:2; }
    }
    #error { color:var(--bad); }
  </style>
</head>
<body>
  <header>
    <strong>Silicone Shadows</strong>
    <nav>
      <a href="/review">Review</a>
      <a class="active" href="/stats">Stats</a>
      <a href="/compare">Compare</a>
    </nav>
  </header>
  <main>
    <h1>Catalog progress</h1>
    <div id="error"></div>
    <section class="summary-charts">
      <article class="summary-chart">
        <h2>Image quality <span class="catalog-total">— products</span></h2>
        <div id="quality-summary" class="summary-stack"></div>
        <div id="quality-keys" class="summary-keys"></div>
      </article>
      <article class="summary-chart">
        <h2>Comparison readiness <span class="catalog-total">— products</span></h2>
        <div id="readiness-summary" class="summary-stack"></div>
        <div id="readiness-keys" class="summary-keys"></div>
      </article>
    </section>

    <h2>By vendor</h2>
    <div class="legend" aria-label="Chart legend">
      <span class="good-key"><i></i>Good</span>
      <span class="perspective-key"><i></i>Bad perspective</span>
      <span class="unusable-key"><i></i>Unusable</span>
      <span class="unprocessed-key"><i></i>Not processed</span>
    </div>
    <div id="vendors" class="chart"></div>

    <h2>By product type</h2>
    <div class="legend" aria-label="Chart legend">
      <span class="good-key"><i></i>Good</span>
      <span class="perspective-key"><i></i>Bad perspective</span>
      <span class="unusable-key"><i></i>Unusable</span>
      <span class="unprocessed-key"><i></i>Not processed</span>
    </div>
    <div id="types" class="chart"></div>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);

    function renderSummaryBar(bar, keys, states) {
      bar.replaceChildren();
      keys.replaceChildren();
      for (const [className, label, count] of states) {
        if (count) {
          const segment = document.createElement('div');
          segment.className = `segment ${className}`;
          segment.style.flexGrow = count;
          segment.textContent = count;
          segment.title = `${label}: ${count}`;
          bar.appendChild(segment);
        }
        const key = document.createElement('span');
        key.className = className;
        key.innerHTML = '<i></i>';
        key.append(label, ' ', Object.assign(document.createElement('strong'), {textContent: count}));
        keys.appendChild(key);
      }
    }

    function renderBreakdown(target, rows) {
      target.replaceChildren();
      for (const item of rows) {
        const row = document.createElement('div');
        row.className = 'chart-row';
        const name = document.createElement('div');
        name.className = 'chart-name';
        name.textContent = item.name;
        name.title = item.name;
        const stack = document.createElement('div');
        stack.className = 'stack';
        const states = [
          ['good', 'Good', item.good],
          ['perspective', 'Bad perspective', item.bad_perspective],
          ['unusable', 'Unusable', item.unusable],
          ['unprocessed', 'Not processed', item.total - item.reviewed],
        ];
        for (const [className, label, count] of states) {
          if (!count) continue;
          const segment = document.createElement('div');
          segment.className = `segment ${className}`;
          segment.style.flexGrow = count;
          segment.textContent = count;
          segment.title = `${label}: ${count}`;
          segment.setAttribute('aria-label', `${label}: ${count}`);
          stack.appendChild(segment);
        }
        const total = document.createElement('div');
        total.className = 'chart-total';
        total.append(String(item.total));
        const totalLabel = document.createElement('small');
        totalLabel.textContent = 'Total';
        total.appendChild(totalLabel);
        row.append(name, stack, total);
        target.appendChild(row);
      }
    }

    (async () => {
      try {
        const response = await fetch('/api/stats');
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        const data = await response.json();
        const summary = data.summary;
        document.querySelectorAll('.catalog-total').forEach(target => {
          target.textContent = `${summary.products} products`;
        });
        renderSummaryBar($('#quality-summary'), $('#quality-keys'), [
          ['good', 'Good', summary.good],
          ['perspective', 'Bad perspective', summary.bad_perspective],
          ['unusable', 'Unusable', summary.unusable],
          ['unprocessed', 'Not processed', summary.products - summary.good - summary.bad_perspective - summary.unusable],
        ]);
        renderSummaryBar($('#readiness-summary'), $('#readiness-keys'), [
          ['ready', 'Ready to compare', summary.comparable],
          ['review-pending', 'Pending review', summary.pending_review],
          ['unprocessed', 'Not processed', summary.products - summary.comparable - summary.pending_review],
        ]);
        renderBreakdown($('#vendors'), data.vendors);
        renderBreakdown($('#types'), data.product_types);
      } catch (error) {
        $('#error').textContent = error.message;
      }
    })();
  </script>
</body>
</html>
