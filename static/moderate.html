<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silicone Shadows · Moderation</title>
  <style>
    :root { color-scheme:dark; font:15px/1.4 system-ui,sans-serif; --bg:#111418; --panel:#1a1f25; --border:#333b45; --text:#e8edf2; --muted:#98a3ae; --accent:#22d3ee; --good:#4ade80; --bad:#fb7185; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); }
    main { max-width:1100px; margin:auto; padding:1rem; }
    #submissions { display:grid; gap:1rem; }
    article { padding:1rem; border:1px solid var(--border); border-radius:9px; background:var(--panel); }
    h2 { margin:0; font-size:1.2rem; }
    .meta { color:var(--muted); margin:.2rem 0 .8rem; }
    .images { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; min-height:15rem; }
    .images.single { grid-template-columns:1fr; }
    .images figure { margin:0; display:grid; grid-template-rows:auto minmax(0,1fr); }
    figcaption { color:var(--muted); margin-bottom:.3rem; }
    .images img { width:100%; height:24rem; object-fit:contain; border-radius:6px; background:#ecece8; }
    .actions { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:flex-end; margin-top:.8rem; }
    button { padding:.55rem .8rem; color:var(--text); border:1px solid var(--border); border-radius:6px; background:#252c34; cursor:pointer; }
    button.approve { color:var(--bg); border-color:var(--good); background:var(--good); }
    button.reject { color:var(--bg); border-color:var(--bad); background:var(--bad); }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .submitted-outline { margin:.9rem 0; }
    .submitted-outline + .submitted-outline { margin-top:1.8rem; }
    .outline-heading { display:flex; align-items:baseline; justify-content:space-between; gap:1rem; margin-bottom:.5rem; }
    .submitted-outline h3 { margin:0; font-size:1rem; }
    .outline-edit { color:var(--muted); font-size:.9rem; text-decoration:none; white-space:nowrap; }
    .outline-edit:hover, .outline-edit:focus-visible { color:var(--accent); text-decoration:underline; }
    .rating-options { margin-top:.6rem; display:grid; grid-template-columns:repeat(3,1fr); flex:1 1 18rem; overflow:hidden; border:1px solid var(--border); border-radius:6px; }
    .rating-options button { border:0; border-radius:0; white-space:nowrap; }
    .rating-options button + button { border-left:1px solid var(--border); }
    .rating-options button.active { background:#164b56; }
    #status { color:var(--muted); margin:.8rem 0; }
    @media (max-width:700px) { .images { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/static/nav.css?v=20260923-2">
</head>
<body>
  <header class="app-header">
    <strong>Silicone Shadows</strong>
    <div data-app-nav="moderate"></div>
  </header>
  <main>
    <h1>Pending review</h1>
    <div id="status" role="status">Loading…</div>
    <section id="submissions"></section>
  </main>
  <script src="/static/nav.js?v=20260923-2"></script>
  <script>
    const target = document.querySelector('#submissions');
    const status = document.querySelector('#status');

    async function request(url, options={}) {
      const response = await fetch(url, options);
      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;
        try { message = (await response.json()).detail || message; } catch (_) {}
        throw new Error(message);
      }
      return response.status === 204 ? null : response.json();
    }

    async function decide(item, decision, ratings) {
      try {
        const catalog = item.kind === 'catalog' || item.outline_revision;
        const query = decision === 'approve' && !catalog ? `?rating=${encodeURIComponent(ratings[''])}` : '';
        const options = {method:'POST'};
        if (decision === 'approve' && catalog) {
          options.headers = {'Content-Type':'application/json'};
          options.body = JSON.stringify(ratings);
        }
        await request(`/api/moderation/submissions/${encodeURIComponent(item.item_id)}/${decision}${query}`, options);
        await load();
      } catch (error) { status.textContent = error.message; }
    }

    function outlineSection(item, outline, ratings) {
      const section = document.createElement('section');
      section.className = 'submitted-outline';
      const headingRow = document.createElement('div'); headingRow.className = 'outline-heading';
      const heading = document.createElement('h3'); heading.textContent = outline.label || 'Outline';
      const edit = document.createElement('a'); edit.className = 'outline-edit'; edit.textContent = 'Edit';
      edit.setAttribute('aria-label', `Edit ${outline.label || 'outline'}`);
      edit.href = `/editor?item=${encodeURIComponent(item.item_id)}&variant=${encodeURIComponent(outline.id)}&edit=1`;
      headingRow.append(heading, edit); section.append(headingRow);
      const previews = document.createElement('div'); previews.className = 'images';
      for (const [caption, url] of [['Source', outline.source_url], ['Normalized outline', outline.outline_url]]) {
        if (!url) continue;
        const figure = document.createElement('figure');
        const title = document.createElement('figcaption'); title.textContent = caption;
        const image = document.createElement('img'); image.src = url; image.alt = `${outline.label || 'Submitted'} ${caption}`;
        figure.append(title, image); previews.append(figure);
      }
      if (previews.children.length === 1) previews.classList.add('single');
      if (previews.children.length) section.append(previews);
      const controls = document.createElement('div'); controls.className = 'rating-options';
      controls.setAttribute('role', 'radiogroup');
      controls.setAttribute('aria-label', `${outline.label || 'Outline'} quality`);
      ratings[outline.id] = outline.quality;
      for (const [rating, label] of [['unusable','Unusable'], ['bad_perspective','Bad perspective'], ['good','Good']]) {
        const button = document.createElement('button'); button.textContent = label;
        button.dataset.rating = rating; button.setAttribute('role', 'radio');
        button.disabled = (rating === 'unusable' && item.kind !== 'catalog') ||
          (rating !== 'unusable' && !outline.outline_url);
        button.addEventListener('click', () => {
          ratings[outline.id] = rating;
          updateRating();
        });
        controls.append(button);
      }
      function updateRating() {
        for (const button of controls.querySelectorAll('button')) {
          const active = button.dataset.rating === ratings[outline.id];
          button.classList.toggle('active', active);
          button.setAttribute('aria-checked', String(active));
        }
      }
      updateRating(); section.append(controls);
      return section;
    }

    async function load() {
      const data = await request('/api/moderation/submissions');
      target.replaceChildren();
      window.setModerationCount(data.submissions.length);
      status.textContent = data.submissions.length ? `${data.submissions.length} pending` : 'Nothing is waiting for review.';
      for (const item of data.submissions) {
        const article = document.createElement('article');
        const title = document.createElement('h2');
        title.textContent = item.products.map(product => `${product.vendor} · ${product.name}`).join(' / ');
        const meta = document.createElement('div'); meta.className = 'meta';
        const variants = item.variants || [];
        const source = item.kind === 'independent_update' ? 'metadata-only update' : `${item.source} source`;
        meta.textContent = `${variants.length ? '' : `${source} · `}submitted by ${item.contributor}`;
        article.append(title, meta);
        const ratings = {};
        // The root source is a fallback preview only when its outline exists.
        if (!variants.length || item.outline_url) {
          article.append(outlineSection(item, {
            id:'', label:variants.length ? 'Fallback outline' : '', quality:item.rating,
            source_url:item.source_url, outline_url:item.outline_url,
          }, ratings));
        }
        for (const variant of variants) article.append(outlineSection(item, variant, ratings));
        const actions = document.createElement('div'); actions.className = 'actions';
        for (const [decision, label] of [['reject','Reject'], ['approve',variants.length ? 'Accept product' : 'Accept']]) {
          const button = document.createElement('button'); button.className = decision; button.textContent = label;
          button.addEventListener('click', () => decide(item, decision, ratings));
          actions.append(button);
        }
        article.append(actions); target.append(article);
      }
    }

    load().catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
