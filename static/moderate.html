<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silicone Shadows · Moderation</title>
  <style>
    :root { color-scheme:dark; font:15px/1.4 system-ui,sans-serif; --bg:#111418; --panel:#1a1f25; --border:#333b45; --text:#e8edf2; --muted:#98a3ae; --accent:#22d3ee; --good:#4ade80; --bad:#fb7185; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); }
    main { max-width:1100px; margin:auto; padding:1rem; }
    #submissions { display:grid; gap:1rem; }
    article { padding:1rem; border:1px solid var(--border); border-radius:9px; background:var(--panel); }
    h2 { margin:0; font-size:1.2rem; }
    .meta { color:var(--muted); margin:.2rem 0 .8rem; }
    .images { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; min-height:15rem; }
    .images.single { grid-template-columns:1fr; }
    .images figure { margin:0; display:grid; grid-template-rows:auto minmax(0,1fr); }
    figcaption { color:var(--muted); margin-bottom:.3rem; }
    .images img { width:100%; height:24rem; object-fit:contain; border-radius:6px; background:#ecece8; }
    .actions { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:flex-end; margin-top:.8rem; }
    button { padding:.55rem .8rem; color:var(--text); border:1px solid var(--border); border-radius:6px; background:#252c34; cursor:pointer; }
    button.approve { color:var(--bg); border-color:var(--good); background:var(--good); }
    button.reject { color:var(--bg); border-color:var(--bad); background:var(--bad); }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .rating-options { display:grid; grid-template-columns:repeat(3,1fr); flex:1 1 18rem; overflow:hidden; border:1px solid var(--border); border-radius:6px; }
    .rating-options button { border:0; border-radius:0; white-space:nowrap; }
    .rating-options button + button { border-left:1px solid var(--border); }
    .rating-options button.active { background:#164b56; }
    #status { color:var(--muted); margin:.8rem 0; }
    @media (max-width:700px) { .images { grid-template-columns:1fr; } }
  </style>
  <link rel="stylesheet" href="/static/nav.css?v=20260822-1">
</head>
<body>
  <header class="app-header">
    <strong>Silicone Shadows</strong>
    <div data-app-nav="moderate"></div>
  </header>
  <main>
    <h1>Pending review</h1>
    <div id="status" role="status">Loading…</div>
    <section id="submissions"></section>
  </main>
  <script src="/static/nav.js?v=20260822-2"></script>
  <script>
    const target = document.querySelector('#submissions');
    const status = document.querySelector('#status');

    async function request(url, options={}) {
      const response = await fetch(url, options);
      if (!response.ok) {
        let message = `${response.status} ${response.statusText}`;
        try { message = (await response.json()).detail || message; } catch (_) {}
        throw new Error(message);
      }
      return response.status === 204 ? null : response.json();
    }

    async function decide(itemId, decision, rating) {
      try {
        const query = decision === 'approve' ? `?rating=${encodeURIComponent(rating)}` : '';
        await request(`/api/moderation/submissions/${encodeURIComponent(itemId)}/${decision}${query}`, {method:'POST'});
        await load();
      } catch (error) { status.textContent = error.message; }
    }

    async function load() {
      const data = await request('/api/moderation/submissions');
      target.replaceChildren();
      window.setModerationCount(data.submissions.length);
      status.textContent = data.submissions.length ? `${data.submissions.length} pending` : 'Nothing is waiting for review.';
      for (const item of data.submissions) {
        const article = document.createElement('article');
        const names = item.products.map(product => `${product.vendor} · ${product.name}`).join(' / ');
        article.innerHTML = `<h2></h2><div class="meta"></div><div class="images"><figure><figcaption>Source</figcaption><img class="source" alt="Submitted source"></figure><figure class="outline-figure"><figcaption>Normalized outline</figcaption><img class="outline" alt="Submitted outline"></figure></div><div class="actions"><button class="reject">Reject</button><div class="rating-options" role="radiogroup" aria-label="Rating"><button data-rating="unusable" role="radio">Unusable</button><button data-rating="bad_perspective" role="radio">Bad perspective</button><button data-rating="good" role="radio">Good</button></div><button class="approve">Accept</button></div>`;
        article.querySelector('h2').textContent = names;
        const source = item.kind === 'independent_update' ? 'metadata-only update' : `${item.source} source`;
        let selectedRating = item.rating;
        const setRating = rating => {
          selectedRating = rating;
          article.querySelector('.meta').textContent = `${rating.replace('_',' ')} · ${source} · submitted by ${item.contributor}`;
          for (const button of article.querySelectorAll('[data-rating]')) {
            const active = button.dataset.rating === rating;
            button.classList.toggle('active', active);
            button.setAttribute('aria-checked', String(active));
          }
        };
        for (const button of article.querySelectorAll('[data-rating]')) {
          const rating = button.dataset.rating;
          button.disabled = (rating === 'unusable' && item.kind !== 'catalog') ||
            (rating !== 'unusable' && !item.outline_url);
          button.addEventListener('click', () => setRating(rating));
        }
        setRating(selectedRating);
        if (item.source_url) article.querySelector('.source').src = item.source_url;
        else {
          article.querySelector('.source').closest('figure').remove();
          article.querySelector('.images').classList.add('single');
        }
        if (item.outline_url) article.querySelector('.outline').src = item.outline_url;
        else article.querySelector('.outline-figure').remove();
        article.querySelector('.approve').addEventListener('click', () =>
          decide(item.item_id, 'approve', selectedRating));
        article.querySelector('.reject').addEventListener('click', () => decide(item.item_id, 'reject'));
        target.appendChild(article);
      }
    }

    load().catch(error => { status.textContent = error.message; });
  </script>
</body>
</html>
