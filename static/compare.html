<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Batch Outliner — Compare</title>
  <style>
    :root { color-scheme:dark; font:15px/1.4 system-ui,sans-serif; --bg:#111418; --panel:#1a1f25; --border:#333b45; --text:#e8edf2; --muted:#98a3ae; --accent:#22d3ee; --danger:#fb7185; }
    * { box-sizing:border-box; }
    body { margin:0; height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden; background:var(--bg); color:var(--text); }
    header { height:58px; display:flex; align-items:center; gap:1rem; padding:.6rem 1rem; background:var(--panel); border-bottom:1px solid var(--border); }
    header strong { margin-right:auto; }
    nav { display:flex; gap:.35rem; }
    nav a { color:var(--muted); text-decoration:none; padding:.4rem .6rem; border-radius:5px; }
    nav a:hover, nav a.active { color:var(--text); background:#28313a; }
    main { display:grid; grid-template-columns:330px minmax(0,1fr); min-height:0; }
    aside { overflow-y:auto; padding:.8rem; background:var(--panel); border-right:1px solid var(--border); }
    fieldset { margin:0 0 .8rem; padding:.65rem; border:1px solid var(--border); border-radius:7px; }
    legend { padding:0 .35rem; color:var(--muted); }
    label { display:block; margin:.45rem 0 .2rem; color:var(--muted); font-size:.86rem; }
    input, select, button { width:100%; color:var(--text); background:#252c34; border:1px solid var(--border); border-radius:6px; padding:.5rem .6rem; font:inherit; }
    input[type="range"] { padding:0; accent-color:var(--accent); }
    button { cursor:pointer; }
    button:hover, button.active { border-color:var(--accent); background:#263943; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; }
    #add, #add-filter { margin-top:.65rem; background:#164b56; border-color:#168da0; font-weight:650; }
    #canvas-wrap { position:relative; min-width:0; min-height:0; background:#ecece8; }
    canvas { display:block; width:100%; height:100%; touch-action:none; cursor:default; }
    #empty { position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:#59616a; pointer-events:none; }
    #empty.hidden { display:none; }
    #layers { display:grid; gap:.4rem; }
    .layer { display:grid; grid-template-columns:auto 1fr auto; gap:.5rem; align-items:center; padding:.45rem; border:1px solid var(--border); border-radius:6px; cursor:pointer; }
    .layer.selected { border-color:var(--accent); }
    .swatch { width:16px; height:16px; border-radius:3px; }
    .layer-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .layer-name small { display:block; color:var(--muted); }
    .remove { width:auto; padding:.2rem .45rem; color:var(--danger); }
    .hint, #status { color:var(--muted); font-size:.85rem; margin-top:.55rem; }
    #status.error { color:var(--danger); }
    output { color:var(--muted); float:right; }
  </style>
</head>
<body>
  <header>
    <strong>Batch Outliner</strong>
    <nav><a href="/">Review</a><a href="/stats">Stats</a><a class="active" href="/compare">Compare</a></nav>
  </header>
  <main>
    <aside>
      <fieldset>
        <legend>Add product size</legend>
        <input id="search" type="search" placeholder="Product name contains…">
        <div class="row">
          <input id="vendor" type="search" placeholder="Vendor…">
          <input id="type" type="search" placeholder="Type…">
        </div>
        <label for="product">Product</label>
        <select id="product"></select>
        <label for="size">Size</label>
        <select id="size"></select>
        <button id="add">Add to canvas</button>
        <button id="add-filter">Add all filtered (all sizes)</button>
      </fieldset>

      <fieldset>
        <legend>Display</legend>
        <div class="row"><button id="imperial" class="active">Imperial</button><button id="metric">Metric</button></div>
        <label for="scale">Canvas scale <output id="scale-value">48 px/in</output></label>
        <input id="scale" type="range" min="20" max="90" value="48">
        <div class="row" style="margin-top:.65rem"><button id="remove-selected">Remove selected</button><button id="clear">Clear canvas</button></div>
      </fieldset>

      <fieldset>
        <legend>Layers</legend>
        <div id="layers"></div>
        <div class="hint">Click an object or layer to bring it to the front, then drag it freely.</div>
      </fieldset>
      <div id="status"></div>
    </aside>
    <section id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="empty">Add one or more reviewed product sizes to compare them.</div>
    </section>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);
    const canvas = $('#canvas');
    const wrap = $('#canvas-wrap');
    const ctx = canvas.getContext('2d');
    const palette = ['#dc2626','#2563eb','#16a34a','#9333ea','#ea580c','#0891b2','#db2777','#4f46e5'];
    let products = [];
    let shownProducts = [];
    let objects = [];
    let selected = null;
    let drag = null;
    let metric = false;
    let pixelsPerInch = 48;
    let nextId = 1;
    let bulkAdding = false;

    function setStatus(message, error=false) {
      $('#status').textContent = message;
      $('#status').classList.toggle('error', error);
    }

    function formatLength(inches) {
      return metric ? `${(inches * 2.54).toFixed(1)} cm` : `${inches} in`;
    }

    async function loadImage(url) {
      const response = await fetch(`${url}?v=${Date.now()}`);
      if (!response.ok) throw new Error('Could not load reviewed SVG');
      const document = new DOMParser().parseFromString(await response.text(), 'image/svg+xml');
      const root = document.documentElement;
      const viewBox = root.getAttribute('viewBox')?.trim().split(/\s+/).map(Number);
      if (!viewBox || viewBox.length !== 4 || !viewBox.every(Number.isFinite)) {
        throw new Error('Reviewed SVG has no valid viewBox');
      }
      const rasterScale = 1200 / Math.max(viewBox[2], viewBox[3]);
      root.setAttribute('width', String(Math.max(1, Math.round(viewBox[2] * rasterScale))));
      root.setAttribute('height', String(Math.max(1, Math.round(viewBox[3] * rasterScale))));
      const objectUrl = URL.createObjectURL(new Blob(
        [new XMLSerializer().serializeToString(root)], { type: 'image/svg+xml' },
      ));
      const image = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error('Could not load reviewed SVG'));
        image.src = objectUrl;
      });
      URL.revokeObjectURL(objectUrl);
      return { image, rasterScale };
    }

    function tintImage(image, color) {
      const tinted = document.createElement('canvas');
      tinted.width = image.naturalWidth;
      tinted.height = image.naturalHeight;
      const target = tinted.getContext('2d');
      target.drawImage(image, 0, 0);
      target.globalCompositeOperation = 'source-in';
      target.fillStyle = color;
      target.fillRect(0, 0, tinted.width, tinted.height);
      return tinted;
    }

    function filterProducts() {
      const name = $('#search').value.trim().toLowerCase();
      const vendor = $('#vendor').value.trim().toLowerCase();
      const type = $('#type').value.trim().toLowerCase();
      shownProducts = products.filter(product =>
        product.n.toLowerCase().includes(name) &&
        product.vn.toLowerCase().includes(vendor) &&
        product.pt.toLowerCase().includes(type));
      const select = $('#product');
      const previous = select.value;
      select.replaceChildren();
      for (const product of shownProducts) {
        const option = document.createElement('option');
        option.value = product.id;
        option.textContent = `${product.vn} — ${product.n}`;
        select.appendChild(option);
      }
      if ([...select.options].some(option => option.value === previous)) select.value = previous;
      updateSizes();
      const sizeCount = shownProducts.reduce((total, product) => total + product.sizes.length, 0);
      $('#add-filter').textContent = `Add all filtered (${sizeCount} sizes)`;
      $('#add-filter').disabled = bulkAdding || sizeCount === 0;
    }

    function selectedProduct() {
      return shownProducts.find(product => String(product.id) === $('#product').value);
    }

    function updateSizes() {
      const product = selectedProduct();
      const select = $('#size');
      select.replaceChildren();
      if (!product) return;
      product.sizes.forEach((size, position) => {
        const option = document.createElement('option');
        option.value = position;
        option.textContent = `${size.label} — ${size.name} — ${formatLength(size.length_in)}`;
        select.appendChild(option);
      });
    }

    function addObject(product, size, loaded, color, image=tintImage(loaded.image, color)) {
      const start = product.main_length.start;
      const end = product.main_length.end;
      const object = {
        id: nextId++, product, size, image, color, rasterScale: loaded.rasterScale,
        midpoint: [
          (start[0] + end[0]) / 2 * loaded.rasterScale,
          (start[1] + end[1]) / 2 * loaded.rasterScale,
        ],
        rotation: -Math.PI / 2 - Math.atan2(end[1] - start[1], end[0] - start[0]),
        x: wrap.clientWidth / 2 + (objects.length % 5) * 16,
        y: wrap.clientHeight / 2 + (objects.length % 5) * 12,
      };
      objects.push(object);
      selected = object;
    }

    async function addProduct() {
      const product = selectedProduct();
      const size = product?.sizes[Number($('#size').value)];
      if (!product || !size) return;
      try {
        setStatus('Loading outline…');
        const loaded = await loadImage(product.svg_url);
        addObject(product, size, loaded, palette[objects.length % palette.length]);
        setStatus(''); renderLayers(); render();
      } catch (error) { setStatus(error.message, true); }
    }

    async function addFiltered() {
      const variants = shownProducts.map(product => ({
        product,
        sizes: product.sizes.filter(size => !objects.some(object =>
          String(object.product.id) === String(product.id) && object.size.index === size.index)),
      })).filter(entry => entry.sizes.length);
      if (!variants.length) return setStatus('All filtered sizes are already on the canvas');
      bulkAdding = true;
      $('#add-filter').disabled = true;
      let added = 0;
      let failures = 0;
      for (let index = 0; index < variants.length; index++) {
        const { product, sizes } = variants[index];
        setStatus(`Loading ${index + 1} of ${variants.length} filtered products…`);
        try {
          const loaded = await loadImage(product.svg_url);
          const color = palette[objects.length % palette.length];
          const image = tintImage(loaded.image, color);
          for (const size of sizes) {
            addObject(product, size, loaded, color, image);
            added++;
          }
        } catch (_) { failures++; }
      }
      bulkAdding = false;
      $('#add-filter').disabled = shownProducts.length === 0;
      setStatus(
        `${added} size${added === 1 ? '' : 's'} added${failures ? `; ${failures} outlines failed to load` : ''}`,
        failures > 0,
      );
      renderLayers(); render();
    }

    function objectScale(object) {
      const line = object.product.main_length;
      const pixels = Math.hypot(
        line.end[0] - line.start[0], line.end[1] - line.start[1],
      ) * object.rasterScale;
      return pixelsPerInch * object.size.length_in / pixels;
    }

    function drawGrid(width, height) {
      ctx.save();
      ctx.strokeStyle = '#d3d5d2';
      ctx.fillStyle = '#7b8288';
      ctx.font = '11px system-ui';
      const spacing = metric ? pixelsPerInch / 2.54 : pixelsPerInch;
      const majorEvery = metric ? 5 : 1;
      for (let index = 0, x = 0; x < width; index++, x = index * spacing) {
        ctx.globalAlpha = index % majorEvery === 0 ? .8 : .35;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        if (index && index % majorEvery === 0) ctx.fillText(metric ? `${index} cm` : `${index} in`, x + 3, 13);
      }
      for (let index = 0, y = 0; y < height; index++, y = index * spacing) {
        ctx.globalAlpha = index % majorEvery === 0 ? .8 : .35;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }
      ctx.restore();
    }

    function render() {
      const ratio = devicePixelRatio || 1;
      const width = wrap.clientWidth;
      const height = wrap.clientHeight;
      if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
        canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
      }
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#ecece8'; ctx.fillRect(0, 0, width, height);
      drawGrid(width, height);
      for (const object of objects) {
        const scale = objectScale(object);
        ctx.save();
        ctx.translate(object.x, object.y);
        ctx.rotate(object.rotation);
        ctx.scale(scale, scale);
        ctx.translate(-object.midpoint[0], -object.midpoint[1]);
        ctx.globalAlpha = .68;
        ctx.drawImage(object.image, 0, 0);
        if (object === selected) {
          ctx.globalAlpha = 1;
          ctx.strokeStyle = object.color;
          ctx.lineWidth = 2 / scale;
          ctx.setLineDash([6 / scale, 4 / scale]);
          ctx.strokeRect(0, 0, object.image.width, object.image.height);
        }
        ctx.restore();
      }
      $('#empty').classList.toggle('hidden', objects.length > 0);
    }

    function localPoint(object, x, y) {
      const scale = objectScale(object);
      const dx = x - object.x, dy = y - object.y;
      const cosine = Math.cos(object.rotation), sine = Math.sin(object.rotation);
      return [
        (cosine * dx + sine * dy) / scale + object.midpoint[0],
        (-sine * dx + cosine * dy) / scale + object.midpoint[1],
      ];
    }

    function hitObject(x, y) {
      for (let index = objects.length - 1; index >= 0; index--) {
        const object = objects[index];
        const point = localPoint(object, x, y);
        if (point[0] < 0 || point[1] < 0 || point[0] >= object.image.width || point[1] >= object.image.height) continue;
        const alpha = object.image.getContext('2d').getImageData(Math.floor(point[0]), Math.floor(point[1]), 1, 1).data[3];
        if (alpha > 10) return object;
      }
      return null;
    }

    function updateUnits() {
      $('#scale-value').textContent = metric
        ? `${(pixelsPerInch / 2.54).toFixed(1)} px/cm`
        : `${pixelsPerInch} px/in`;
      updateSizes(); renderLayers(); render();
    }

    function renderLayers() {
      const layers = $('#layers');
      layers.replaceChildren();
      for (const object of [...objects].reverse()) {
        const layer = document.createElement('div');
        layer.className = `layer${object === selected ? ' selected' : ''}`;
        const swatch = document.createElement('span'); swatch.className = 'swatch'; swatch.style.background = object.color;
        const name = document.createElement('span'); name.className = 'layer-name'; name.textContent = `${object.product.n} — ${object.size.label}`;
        const detail = document.createElement('small'); detail.textContent = formatLength(object.size.length_in); name.appendChild(detail);
        const remove = document.createElement('button'); remove.className = 'remove'; remove.textContent = '×';
        remove.addEventListener('click', event => { event.stopPropagation(); removeObject(object); });
        layer.append(swatch, name, remove);
        layer.addEventListener('click', () => selectObject(object));
        layers.appendChild(layer);
      }
    }

    function selectObject(object) {
      selected = object;
      const index = objects.indexOf(object);
      if (index >= 0) objects.push(...objects.splice(index, 1));
      renderLayers(); render();
    }

    function removeObject(object) {
      objects = objects.filter(item => item !== object);
      if (selected === object) selected = objects.at(-1) || null;
      renderLayers(); render();
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return [event.clientX - rect.left, event.clientY - rect.top];
    }
    canvas.addEventListener('pointerdown', event => {
      const [x, y] = pointerPosition(event);
      const object = hitObject(x, y);
      if (!object) { selected = null; renderLayers(); render(); return; }
      selectObject(object);
      drag = { x, y, ox: object.x, oy: object.y };
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!drag || !selected) return;
      const [x, y] = pointerPosition(event);
      selected.x = drag.ox + x - drag.x; selected.y = drag.oy + y - drag.y;
      render();
    });
    const finishDrag = () => { drag = null; };
    canvas.addEventListener('pointerup', finishDrag);
    canvas.addEventListener('pointercancel', finishDrag);

    for (const input of [$('#search'), $('#vendor'), $('#type')]) input.addEventListener('input', filterProducts);
    $('#product').addEventListener('change', updateSizes);
    $('#add').addEventListener('click', addProduct);
    $('#add-filter').addEventListener('click', addFiltered);
    $('#imperial').addEventListener('click', () => { metric = false; $('#imperial').classList.add('active'); $('#metric').classList.remove('active'); updateUnits(); });
    $('#metric').addEventListener('click', () => { metric = true; $('#metric').classList.add('active'); $('#imperial').classList.remove('active'); updateUnits(); });
    $('#scale').addEventListener('input', event => { pixelsPerInch = Number(event.target.value); $('#scale-value').textContent = metric ? `${(pixelsPerInch / 2.54).toFixed(1)} px/cm` : `${pixelsPerInch} px/in`; render(); });
    $('#remove-selected').addEventListener('click', () => { if (selected) removeObject(selected); });
    $('#clear').addEventListener('click', () => { objects = []; selected = null; renderLayers(); render(); });
    new ResizeObserver(render).observe(wrap);

    (async () => {
      try {
        const response = await fetch('/api/comparison/products');
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
        products = (await response.json()).products;
        filterProducts(); render();
        setStatus(products.length ? `${products.length} reviewed products available` : 'No reviewed products with size and length-vector data yet');
      } catch (error) { setStatus(error.message, true); }
    })();
  </script>
</body>
</html>
